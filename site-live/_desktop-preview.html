<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desktop preview — KRS Travel</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #e9e9e9;
    }

    #desktop-frame {
      display: block;
      width: 1440px;
      height: 2400px;
      border: 0;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <iframe id="desktop-frame" src="index.html" title="KRS Travel desktop preview"></iframe>
  <script>
    const frame = document.getElementById('desktop-frame');

    function fitDesktopPreview() {
      const scale = Math.min(1, window.innerWidth / 1440);
      frame.style.transform = `scale(${scale})`;
      document.body.style.width = `${1440 * scale}px`;
      document.body.style.height = `${2400 * scale}px`;
    }

    fitDesktopPreview();
    window.addEventListener('resize', fitDesktopPreview);
  </script>
</body>
</html>
